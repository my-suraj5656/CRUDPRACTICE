    <div class="container">
      <h1>Consult Doctor Form</h1>
      <form action="" id="book-form">
        <h2>Your Detail</h2>
        <div>
          <label for="">First Name: </label>
          <input type="text" name="firstname" id="firstname" required />
        </div>
        <br />
        <div>
          <label for="">Last Name: </label>
          <input type="text" name="lastname" id="lastname" required />
        </div>
        <br />
        <div>
          <label for="">Email: </label>
          <input type="email" name="email" id="email" required />
        </div>
        <br />
        <div>
          <label for="">Contact No: </label>
          <input type="number" name="number" id="number" required />
        </div>
        <br />
        <h2>Your doctor</h2>
        <div>
          <label for="cars">Choose a doctor:</label>
          <select name="docter" id="docter" required>
            <option value="">select option</option>
            <option value="Dr. John">Dr. John</option>
            <option value="Dr. Moscow">Dr. Moscow</option>
            <option value="Dr. Hen">Dr. Hen</option>
          </select>
        </div>
        <h2>Select meeting</h2>
        <fieldset style="padding: 15px">
          <legend>Choose Meeting</legend>
          <input
            type="radio"
            name="meeting"
            id="meeting"
            value="GoogleMeet"
            required
          />Google Meet
          <br />
          <input
            type="radio"
            name="meeting"
            id="offline"
            value="Offline"
            required
          />Offline
        </fieldset>
        <h2>Select Time & Date</h2>
        <div>
          <label for="">Choose time: </label>
          <input type="datetime-local" name="date" id="date" required />
        </div>
        <br />
        <div>
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>
